[project]
name = "kesaseteli-backend"
version = "1.19.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yjdh-backend-shared",
    "base32-lib@https://github.com/inveniosoftware/base32-lib/archive/bf1b3b188660eecb127031f6d5db1c877b6ab127.zip",
    "django-auditlog",
    "django-auditlog-extra@https://github.com/City-of-Helsinki/django-auditlog-extra/archive/64476c69a68023f78e423be466ac16723b1c8b92.zip",
    "django-resilient-logger",
    "django-auth-adfs",
    "django-cors-headers",
    "django-csp",
    "django-environ",
    "django-extensions",
    "django-filter",
    "drf-spectacular",
    "django-localflavor",
    "django-searchable-encrypted-fields",
    "django-storages[azure]",
    "django~=5.2",
    "djangorestframework",
    "factory-boy",
    "filetype",
    "jsonpath-ng",
    "mozilla-django-oidc",
    "pillow",
    "polyleven",
    "psycopg[binary]",
    "python-stdnum>=1.19",
    "requests",
    "sentry-sdk",
    "xlsx-streaming",
    "xlsxwriter",
]

[dependency-groups]
dev = [
    "ipython",
    "langdetect",
    "openpyxl",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-freezer",
    "pytest-xdist[psutil]",
    "requests-mock",
    "werkzeug",
]
prod = ["uwsgi"]

[tool.uv]
package = false
exclude-newer = "P3D"
# pysaml2's upper bound predates the pyOpenSSL releases compatible with
# cryptography 50.
override-dependencies = ["pyOpenSSL>=26.4.0,<27"]

[tool.uv.sources]
yjdh-backend-shared = { path = "../shared", editable = true }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
]

# E501 = line-too-long / https://docs.astral.sh/ruff/rules/line-too-long/
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["shared"]
known-third-party = [
  # Removed django-simple-history package that's been locally stubbed
  # at /backend/kesaseteli/simple_history/ directory.
  # Only here to make ruff not change old migrations containing imports from it:
  "simple_history",
]
order-by-type = false
