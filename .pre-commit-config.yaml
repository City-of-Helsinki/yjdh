default_language_version:
    python: python3
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [ "--fix" ]
      - id: ruff-format
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg, manual]
        additional_dependencies:
          - "@commitlint/cli@21.2.2"
          - "@commitlint/config-conventional@21.2.2"
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      - id: uv-lock
        name: uv-lock (benefit-backend)
        files: ^backend/(benefit/(pyproject\.toml|uv\.lock)|shared/(pyproject\.toml|setup\.py|shared/__init__\.py))$
        args: [--project, backend/benefit]
      - id: uv-lock
        name: uv-lock (kesaseteli-backend)
        files: ^backend/(kesaseteli/(pyproject\.toml|uv\.lock)|shared/(pyproject\.toml|setup\.py|shared/__init__\.py))$
        args: [--project, backend/kesaseteli]
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
      - id: doctoc
        files: '(^|/)(README|readme)\.md$'
